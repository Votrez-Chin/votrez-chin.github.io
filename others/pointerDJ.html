<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointer DJ | Thomas Cheung</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pointerDJ.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">Thomas Cheung</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#projects" class="active">Projects</a></li>
      </ul>
    </nav>
  </header>

 <main>
    <section class="hero">
      <h2>Cursor Music</h2>
      <p>Move your cursor across the image to change the music and mood.</p>
    </section>

    <section class="projects fade-in" aria-labelledby="try-it-heading">
      <h2 id="try-it-heading">Try It!</h2>

      <div id="pointer-dj-container">
        <div id="background-overlay">
          <p id="now-playing">Move your cursor to choose a mood</p>
        </div>

        <div id="controls">
          <label for="volRange">Volume</label>
          <input id="volRange" type="range" min="0" max="100" value="55">
          <button id="muteBtn" type="button" aria-label="Mute or unmute music">♪</button>
        </div>

        <div id="startOverlay">
          <h2>Cursor DJ</h2>
          <p>Move through the image to change the music.</p>
          <button id="startBtn" type="button">Enter</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Thomas Cheung</p>
  </footer>

  <script src="../js/pointerDJ.js"></script>
</body>
</html>
